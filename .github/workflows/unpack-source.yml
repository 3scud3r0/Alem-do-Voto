name: Bootstrap validated source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify validated source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part*.b64 | base64 -d > /tmp/alem-do-voto-1.3.tar.gz
          gzip -t /tmp/alem-do-voto-1.3.tar.gz
          tar -tzf /tmp/alem-do-voto-1.3.tar.gz >/dev/null

      - name: Unpack source tree
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/alem-do-voto-1.3.tar.gz --strip-components=1
          rm -rf .bootstrap
          rm -f .github/workflows/unpack-source.yml

      - name: Verify source before commit
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run check

      - name: Commit source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: unpack Além do Voto 1.3 source"
          git push
